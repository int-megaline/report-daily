<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일간조선해양 핵심 요약 및 분석 보고서</title>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-color: #0f3d61;
            --secondary-color: #0077b6;
            --accent-color: #00b4d8;
            --bg-color: #f4f7f9;
            --card-bg: #ffffff;
            --text-color: #2b2d42;
            --text-muted: #6c757d;
            --border-color: #e9ecef;
            --metric-bg: #f8fafc;
            --badge-bg: #e0f2fe;
            --badge-text: #0369a1;
        }

        body.dark-mode {
            --primary-color: #3a86ff;
            --secondary-color: #48cae4;
            --accent-color: #90e0ef;
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --text-muted: #a0a0a0;
            --border-color: #333333;
            --metric-bg: #2a2a2a;
            --badge-bg: #1c3d5a;
            --badge-text: #90e0ef;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            position: relative;
            text-align: center;
            margin-bottom: 30px;
            padding: 24px 20px;
            background: linear-gradient(135deg, #0f3d61, #0077b6);
            color: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            font-weight: 700;
        }

        header p {
            font-size: 0.95rem;
            opacity: 0.9;
        }

        .header-controls {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 8px;
        }

        .btn-control {
            background-color: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            backdrop-filter: blur(4px);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-control:hover {
            background-color: rgba(255, 255, 255, 0.35);
        }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .grid-container {
                grid-template-columns: repeat(2, 1fr);
            }
            .full-width {
                grid-column: span 2;
            }
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--border-color);
        }

        .card-title {
            font-size: 1.25rem;
            color: var(--primary-color);
            font-weight: 700;
        }

        .badge {
            background-color: var(--badge-bg);
            color: var(--badge-text);
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 600;
        }

        .card-content {
            flex: 1;
        }

        ul.summary-list {
            list-style: none;
        }

        ul.summary-list li {
            position: relative;
            padding-left: 20px;
            margin-bottom: 12px;
            font-size: 0.95rem;
        }

        ul.summary-list li::before {
            content: "•";
            color: var(--secondary-color);
            font-weight: bold;
            font-size: 1.2rem;
            position: absolute;
            left: 0;
            top: -2px;
        }

        .ref {
            font-size: 0.75rem;
            color: var(--secondary-color);
            vertical-align: super;
            font-weight: bold;
            cursor: pointer;
            margin-left: 2px;
            text-decoration: none;
        }

        .ref:hover {
            text-decoration: underline;
        }

        .chart-container {
            position: relative;
            width: 100%;
            height: 280px;
            margin-top: 15px;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 15px;
        }

        .metric-card {
            background-color: var(--metric-bg);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .metric-value {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--secondary-color);
        }

        .metric-label {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        footer {
            margin-top: 30px;
            padding: 20px;
            background-color: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        footer h4 {
            color: var(--text-color);
            margin-bottom: 8px;
        }

        footer ol {
            padding-left: 20px;
        }

        footer li {
            margin-bottom: 6px;
            padding: 4px 8px;
            border-radius: 4px;
            transition: background-color 0.5s ease;
        }

        footer li.highlight {
            background-color: rgba(0, 180, 216, 0.25);
            font-weight: bold;
        }

        @media print {
            body { background-color: white; color: black; padding: 0; }
            .header-controls { display: none; }
            .card { box-shadow: none; border: 1px solid #ccc; page-break-inside: avoid; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="header-controls">
            <a href="../index.html" class="btn-control" style="text-decoration: none;">홈으로</a>
            <a id="btn-pdf-drive" href="#" class="btn-control" style="text-decoration: none;" target="_blank" download>PDF 다운로드</a>
            <button class="btn-control" id="btn-theme">다크모드</button>
            <button class="btn-control" id="btn-print">인쇄</button>
        </div>
        <h1 id="header-title"></h1>
        <p id="header-subtitle"></p>
    </header>

    <div class="grid-container" id="app-grid"></div>

    <footer>
        <h4>[출처 및 각주]</h4>
        <ol id="references-list"></ol>
    </footer>
</div>

<script>
    const reportData = {
        meta: {
            title: "일간조선해양 핵심 요약 및 분석 보고서",
            subtitle: "발행일: 2026년 09월 03일 | 제02-4869호 주요 동향 분석",
            pdfDriveUrl: "https://drive.google.com/uc?export=download&id=1BmMJ7ctkgAThFGCdAkMBfslOcpOwSTzE"
        },
        metrics: [
            { label: "글로벌 수주잔량", value: "6,600억 달러", ref: "1" },
            { label: "17,000TEU+ 중국 수주율", value: "100% (42척)", ref: "2" },
            { label: "한화 Austal 인수 제시액", value: "최대 12억 달러", ref: "3" },
            { label: "HD현대 LCO2 운송용량", value: "3배 향상 (저압)", ref: "4" },
            { label: "Suezmax 최고 일일 TCE", value: "약 40만 달러", ref: "5" },
            { label: "한화오션 VLGC 수주액", value: "4,778억 원", ref: "6" }
        ],
        sections: [
            {
                title: "글로벌 선박 시황 및 수주잔량 동향",
                badge: "시황 분석",
                fullWidth: false,
                items: [
                    "Clarksons Research의 Stephen Gordon 대표는 글로벌 수주잔량이 6,600억 달러로 2024년 대비 30% 증가했으나, 현존선대의 22% 수준으로 2008년(50%)에 비해 선주들이 보수적으로 접근하고 있다고 분석했습니다 <a href=\"#ref-1\" class=\"ref\">[1]</a>.",
                    "연간 해운 화물량은 130억 톤으로 성장을 이어가고 있으나, 중동 분쟁, 미국 관세, 제재 대상 탱커(전체의 25%) 증가 등 지정학적 변수로 인해 실제 필요한 선박 수 산정이 복잡해졌습니다 <a href=\"#ref-1\" class=\"ref\">[1]</a>.",
                    "중동 무력충돌로 호르무즈 해협 통과 원유량이 하루 1,800만 배럴에서 200만 배럴로 급감함에 따라, 수에즈 운하 통항이 유연한 Suezmax급 원유운반선의 일일 TCE가 40만 달러에 육박하며 VLCC를 상회했습니다 <a href=\"#ref-5\" class=\"ref\">[5]</a>.",
                    "지정학적 리스크 심화로 5년 선령 중고 VLCC 가격이 신조선가를 상회하는 이례적 현상이 발생했으며, 최근 6개월간 탱커 수주잔량이 140척(4,190만 dwt) 순증했습니다 <a href=\"#ref-7\" class=\"ref\">[7]</a>."
                ],
                chartId: "chart-market"
            },
            {
                title: "국제 환경규제 및 방산·기술 협력",
                badge: "규제 / 방산",
                fullWidth: false,
                items: [
                    "IMO 산하 ISWG 회의에서 넷제로 프레임워크(NZF) 세부 쟁점 조율에 착수했으며, 11월 MEPC 85 정례회의 표결을 앞두고 있어 조선사들의 장기 수주 및 밸류에이션 호재로 전망됩니다 <a href=\"#ref-8\" class=\"ref\">[8]</a>.",
                    "백악관과 미 해군은 자국 조선소의 건조능력 부족 및 납기 지연에 대응해 한국의 충남급(FFX Batch-III), 일본 Mogami급, 튀르키예 Istanbul급 호위함 설계 및 건조능력 검토에 착수했습니다 <a href=\"#ref-9\" class=\"ref\">[9]</a>.",
                    "한화그룹은 미국 함정 시장 진출을 위해 Austal USA 인수에 최대 12억 달러 예비 제안서를 제출하고 4주간의 정밀 실사에 돌입했습니다 <a href=\"#ref-3\" class=\"ref\">[3]</a>.",
                    "독일 TKMS와 이탈리아 Fincantieri는 잠수함 및 수중 방산 분야 협력 MOU를 체결하여 유럽 해군 방산 산업 분절화 해소 및 비용 절감에 나섰습니다 <a href=\"#ref-10\" class=\"ref\">[10]</a>."
                ]
            },
            {
                title: "조선 시장 경쟁 및 국내외 수주·기술 실적",
                badge: "조선 / 기술",
                fullWidth: true,
                items: [
                    "코마린 컨퍼런스 2026에서 산업연구원 이은창 연구위원은 올해 발주된 17,000-teu급 이상 초대형 컨테이너선 42척을 중국이 전량 수주했으며, LNG선 수주도 중국이 34척으로 한국(32척)을 역전했다고 발표했습니다 <a href=\"#ref-2\" class=\"ref\">[2]</a>.",
                    "HD현대중공업은 영하 50℃, 7기압 저압 화물시스템을 탑재하여 LCO₂ 운송량을 3배 확대한 기술로 제35주차 IR52 장영실상을 수상했습니다 <a href=\"#ref-4\" class=\"ref\">[4]</a>.",
                    "한화오션은 오세아니아 선주(Dorian LPG 추정)로부터 88,000-cbm급 VLGC 3척(4,778억 원, 척당 1.16억 달러, 2030년 인도)을 수주했습니다 <a href=\"#ref-6\" class=\"ref\">[6]</a>.",
                    "선박 탄소포집(OCCS) 및 초소형 원자로(1MW급 Unity Nuclear Battery, LR AiP 획득) 탑재 부유식 데이터센터/선박 등 신기술이 대체연료 인프라 지연의 새로운 대안으로 부상하고 있습니다 <a href=\"#ref-11\" class=\"ref\">[11]</a>."
                ],
                chartId: "chart-competition"
            }
        ],
        references: [
            { id: "1", text: "일간조선해양 제02-4869호 1면 - 향후 선박 수요 가늠 어려워 (Clarksons Research Stephen Gordon 대표 발표)" },
            { id: "2", text: "일간조선해양 제02-4869호 2~3면 - 中 조선, 고부가船 진격 '위협적' (산업연구원 이은창 연구위원 발표)" },
            { id: "3", text: "일간조선해양 제02-4869호 2면 - 한화, Austal USA 인수 셈법 복잡" },
            { id: "4", text: "일간조선해양 제02-4869호 3면 - HD현대重, LCO2船 기술력 입증 (IR52 장영실상 수상)" },
            { id: "5", text: "일간조선해양 제02-4869호 5면 - 중동 항로 재편, Suezmax '주목'" },
            { id: "6", text: "일간조선해양 제02-4869호 4면 - Dorian LPG, VLGC 선대 재편 (한화오션 3척 수주)" },
            { id: "7", text: "일간조선해양 제02-4869호 3면 - VLCC 호황, 신조 발주 '불씨'" },
            { id: "8", text: "일간조선해양 제02-4869호 2면 - IMO 넷제로 재시동, 조선업 기대감" },
            { id: "9", text: "일간조선해양 제02-4869호 2면 - 美 해군, 韓·日·튀르키예 호위함 검토 (USNI News 인용)" },
            { id: "10", text: "일간조선해양 제02-4869호 4면 - 유럽 조선, 잠수함 '동맹' 강화" },
            { id: "11", text: "일간조선해양 제02-4869호 4~5면 - 선박 탄소포집 및 원전 품은 선박 新시장" }
        ]
    };

    let marketChartInst = null;
    let competitionChartInst = null;

    function renderApp() {
        document.getElementById('header-title').innerText = reportData.meta.title;
        document.getElementById('header-subtitle').innerText = reportData.meta.subtitle;

        const pdfBtn = document.getElementById('btn-pdf-drive');
        if (pdfBtn && reportData.meta.pdfDriveUrl) {
            pdfBtn.href = reportData.meta.pdfDriveUrl;
        }

        const grid = document.getElementById('app-grid');
        grid.innerHTML = '';

        const metricCardHtml = `
            <div class="card full-width">
                <div class="card-header">
                    <span class="card-title">주요 한눈에 보기 수치</span>
                    <span class="badge">현황 요약</span>
                </div>
                <div class="metrics-grid">
                    ${reportData.metrics.map(m => `
                        <div class="metric-card">
                            <div class="metric-value">${m.value}</div>
                            <div class="metric-label">${m.label} <a href="#ref-${m.ref}" class="ref">[${m.ref}]</a></div>
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
        grid.insertAdjacentHTML('beforeend', metricCardHtml);

        reportData.sections.forEach(sec => {
            const cardHtml = `
                <div class="card ${sec.fullWidth ? 'full-width' : ''}">
                    <div class="card-header">
                        <span class="card-title">${sec.title}</span>
                        <span class="badge">${sec.badge}</span>
                    </div>
                    <div class="card-content">
                        <ul class="summary-list">
                            ${sec.items.map(item => `<li>${item}</li>`).join('')}
                        </ul>
                        ${sec.chartId ? `<div class="chart-container"><canvas id="${sec.chartId}"></canvas></div>` : ''}
                    </div>
                </div>
            `;
            grid.insertAdjacentHTML('beforeend', cardHtml);
        });

        const refList = document.getElementById('references-list');
        refList.innerHTML = reportData.references.map(r => `
            <li id="ref-${r.id}">${r.text}</li>
        `).join('');

        initCharts();
        bindRefEvents();
    }

    function initCharts() {
        const isDark = document.body.classList.contains('dark-mode');
        const textColor = isDark ? '#e0e0e0' : '#2b2d42';
        const gridColor = isDark ? '#333333' : '#e9ecef';

        const ctxMarket = document.getElementById('chart-market');
        if (ctxMarket) {
            if (marketChartInst) marketChartInst.destroy();
            marketChartInst = new Chart(ctxMarket, {
                type: 'bar',
                data: {
                    labels: ['2024 SMM', '2026 SMM'],
                    datasets: [{
                        label: '글로벌 수주잔량 (십억 달러)',
                        data: [508, 660],
                        backgroundColor: ['#0077b6', '#0f3d61']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        x: { ticks: { color: textColor }, grid: { color: gridColor } },
                        y: { ticks: { color: textColor }, grid: { color: gridColor }, beginAtZero: true }
                    }
                }
            });
        }

        const ctxComp = document.getElementById('chart-competition');
        if (ctxComp) {
            if (competitionChartInst) competitionChartInst.destroy();
            competitionChartInst = new Chart(ctxComp, {
                type: 'bar',
                data: {
                    labels: ['17,000TEU+ 컨선 (척)', 'LNG운반선 수주 (척)'],
                    datasets: [
                        {
                            label: '한국',
                            data: [0, 32],
                            backgroundColor: '#0f3d61'
                        },
                        {
                            label: '중국',
                            data: [42, 34],
                            backgroundColor: '#00b4d8'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { labels: { color: textColor } }
                    },
                    scales: {
                        x: { ticks: { color: textColor }, grid: { color: gridColor } },
                        y: { ticks: { color: textColor }, grid: { color: gridColor }, beginAtZero: true }
                    }
                }
            });
        }
    }

    function bindRefEvents() {
        document.querySelectorAll('.ref').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const targetId = this.getAttribute('href').substring(1);
                const targetElement = document.getElementById(targetId);

                if (targetElement) {
                    targetElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    targetElement.classList.add('highlight');
                    setTimeout(() => {
                        targetElement.classList.remove('highlight');
                    }, 2000);
                }
            });
        });
    }

    document.getElementById('btn-theme').addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
        const isDark = document.body.classList.contains('dark-mode');
        document.getElementById('btn-theme').innerText = isDark ? '라이트모드' : '다크모드';
        initCharts();
    });

    document.getElementById('btn-print').addEventListener('click', () => {
        window.print();
    });

    document.addEventListener('DOMContentLoaded', renderApp);
</script>

</body>
</html>

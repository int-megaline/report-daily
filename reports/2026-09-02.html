<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일간조선해양 핵심 요약 및 분석 보고서</title>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-color: #0f3d61;
            --secondary-color: #0077b6;
            --accent-color: #00b4d8;
            --bg-color: #f4f7f9;
            --card-bg: #ffffff;
            --text-color: #2b2d42;
            --text-muted: #6c757d;
            --border-color: #e9ecef;
            --metric-bg: #f8fafc;
            --badge-bg: #e0f2fe;
            --badge-text: #0369a1;
        }

        body.dark-mode {
            --primary-color: #3a86ff;
            --secondary-color: #48cae4;
            --accent-color: #90e0ef;
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --text-muted: #a0a0a0;
            --border-color: #333333;
            --metric-bg: #2a2a2a;
            --badge-bg: #1c3d5a;
            --badge-text: #90e0ef;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            position: relative;
            text-align: center;
            margin-bottom: 30px;
            padding: 24px 20px;
            background: linear-gradient(135deg, #0f3d61, #0077b6);
            color: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            font-weight: 700;
        }

        header p {
            font-size: 0.95rem;
            opacity: 0.9;
        }

        .header-controls {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 8px;
        }

        .btn-control {
            background-color: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            backdrop-filter: blur(4px);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-control:hover {
            background-color: rgba(255, 255, 255, 0.35);
        }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .grid-container {
                grid-template-columns: repeat(2, 1fr);
            }
            .full-width {
                grid-column: span 2;
            }
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--border-color);
        }

        .card-title {
            font-size: 1.25rem;
            color: var(--primary-color);
            font-weight: 700;
        }

        .badge {
            background-color: var(--badge-bg);
            color: var(--badge-text);
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 600;
        }

        .card-content {
            flex: 1;
        }

        ul.summary-list {
            list-style: none;
        }

        ul.summary-list li {
            position: relative;
            padding-left: 20px;
            margin-bottom: 12px;
            font-size: 0.95rem;
        }

        ul.summary-list li::before {
            content: "•";
            color: var(--secondary-color);
            font-weight: bold;
            font-size: 1.2rem;
            position: absolute;
            left: 0;
            top: -2px;
        }

        .ref {
            font-size: 0.75rem;
            color: var(--secondary-color);
            vertical-align: super;
            font-weight: bold;
            cursor: pointer;
            margin-left: 2px;
            text-decoration: none;
        }

        .ref:hover {
            text-decoration: underline;
        }

        .chart-container {
            position: relative;
            width: 100%;
            height: 280px;
            margin-top: 15px;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 15px;
        }

        .metric-card {
            background-color: var(--metric-bg);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .metric-value {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--secondary-color);
        }

        .metric-label {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        footer {
            margin-top: 30px;
            padding: 20px;
            background-color: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        footer h4 {
            color: var(--text-color);
            margin-bottom: 8px;
        }

        footer ol {
            padding-left: 20px;
        }

        footer li {
            margin-bottom: 6px;
            padding: 4px 8px;
            border-radius: 4px;
            transition: background-color 0.5s ease;
        }

        footer li.highlight {
            background-color: rgba(0, 180, 216, 0.25);
            font-weight: bold;
        }

        @media print {
            body { background-color: white; color: black; padding: 0; }
            .header-controls { display: none; }
            .card { box-shadow: none; border: 1px solid #ccc; page-break-inside: avoid; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="header-controls">
            <a href="../index.html" class="btn-control" style="text-decoration: none;">홈으로</a>
            <a id="btn-pdf-drive" href="#" class="btn-control" style="text-decoration: none;" target="_blank" download>PDF 다운로드</a>
            <button class="btn-control" id="btn-theme">다크모드</button>
            <button class="btn-control" id="btn-print">인쇄</button>
        </div>
        <h1 id="header-title"></h1>
        <p id="header-subtitle"></p>
    </header>

    <div class="grid-container" id="app-grid"></div>

    <footer>
        <h4>[출처 및 각주]</h4>
        <ol id="references-list"></ol>
    </footer>
</div>

<script>
    const reportData = {
        meta: {
            title: "일간조선해양 핵심 요약 및 분석 보고서",
            subtitle: "발행일: 2026년 09월 02일 | 제02-4868호 주요 동향 분석",
            pdfDriveUrl: "https://drive.google.com/uc?export=download&id=1Bcjxhix3swyLk5cDDCRHhTgWBjgYVCiF"
        },
        metrics: [
            { label: "조선 빅3 누적 수주", value: "335억 달러", ref: "1" },
            { label: "HD한국조선해양 목표 달성", value: "77.6% (180.8억불)", ref: "1" },
            { label: "삼성중공업 목표 달성", value: "76.0% (105억불)", ref: "1" },
            { label: "해양플랜트 신규 수주", value: "190억 달러 (+30%)", ref: "5" },
            { label: "한화오션 VLGC 3척 수주액", value: "4,778억 원", ref: "3" },
            { label: "인도 Odisha 클러스터", value: "약 36조 원", ref: "9" }
        ],
        sections: [
            {
                title: "국내 대형 조선사 수주 및 슈퍼사이클 동향",
                badge: "국내 기업",
                fullWidth: false,
                items: [
                    "국내 대형 조선 3사(HD한국조선해양, 삼성중공업, 한화오션)의 올해 누적 수주액이 약 335억 달러를 기록하며 고선가·고부가 선종 중심의 질적 호황이 장기화되고 있습니다.",
                    "HD한국조선해양은 162척(180억 8,000만 달러)을 수주해 연간 목표의 77.6%를 달성했으며, 삼성중공업은 105억 달러(목표의 76%), 한화오션은 32척(59억 4,000만 달러)을 달성했습니다.",
                    "한화오션은 오세아니아 선주로부터 88,000-cbm급 VLGC 3척(총 4,778억 원, 척당 1억 1,570만 달러, 2030년 인도)을 추가 수주하여 대형 가스선 포트폴리오를 강화했습니다.",
                    "경남 중소조선업계는 수주 회복세에도 불구하고 선수금환급보증(RG) 발급 지연 및 엄격한 추가 담보 요구가 실질적 건조 착수의 병목 요인으로 작용하고 있습니다.",
                    "조선 및 방산 호황으로 기업가치가 상승한 STX엔진은 유암코 구조조정펀드 청산 시기와 맞물려 M&A 시장 경영권 매각 절차가 가시화되고 있습니다."
                ],
                chartId: "chart-big3"
            },
            {
                title: "한·미 방산 협력 및 해외 조선 정책",
                badge: "방산 / 정책",
                fullWidth: false,
                items: [
                    "미 해군부 Richard Breckenridge 수석보좌관이 방한하여 HD현대중공업, 한화오션, SK오션플랜트를 방문해 함정 건조 및 MRO 생산 역량을 현장 점검했습니다.",
                    "한화그룹의 Hanwha Philly Shipyard 인수 및 Austal USA 예비 제안(최대 12억 달러), HD한국조선해양의 HD Hyundai USA 설립 등 현지 생산기지 구축이 가속화되고 있습니다.",
                    "미 해사청(MARAD)은 Title XI 조선 금융보증 프로그램의 신청 수수료 인하($5,000 → $1,000) 및 외국산 기자재 승인 전 심사 계속 등 행정절차를 대폭 간소화했습니다.",
                    "영국 Azure Strategy는 동아시아 3국(한·중·일)의 선박 건조 점유율이 95% 이상(중국 55%)에 달함에 따라, 걸프 국가들이 에너지 해양 공급망 독점 리스크 탈피를 추진해야 한다고 제언했습니다."
                ]
            },
            {
                title: "해양플랜트 신조 시장 및 글로벌 산업 동향",
                badge: "해양 / 글로벌",
                fullWidth: true,
                items: [
                    "Clarksons Research에 따르면 2026년 7월 말 기준 이동식 해양설비 및 지원선박 신규 수주가 108기(190억 달러)로 전년 동기 대비 30% 증가했습니다.",
                    "중국 조선소가 79기(154억 달러)로 수주 물량을 독식한 가운데, 한국은 3기(12억 달러)로 수주 척수는 적으나 높은 척당 단가를 기록했습니다.",
                    "China CSSC Holdings는 대규모 수주(177척, 1,193억 위안, 전년비 +93%)와 건조 효율 개선으로 상반기 매출 915억 3,000만 위안(전년비 +26%)을 기록했습니다.",
                    "인도 Odisha주는 Kendrapada 지역에 2조 4,700억 루피(약 36조 원) 규모의 NSHIPOL 조선·중공업 복합 클러스터 추진계획에 대해 정부의 원칙적 승인을 확보했습니다."
                ],
                chartId: "chart-offshore"
            }
        ],
        references: [
            { id: "1", text: "일간조선해양 제02-4868호 1면 - 대형 조선 슈퍼사이클 '진화'" },
            { id: "2", text: "일간조선해양 제02-4868호 2면 - 美 해군, 韓 조선소 현장 점검" },
            { id: "3", text: "일간조선해양 제02-4868호 2면 - 한화오션, 오세아니아서 VLGC 수주" },
            { id: "4", text: "일간조선해양 제02-4868호 2면 - China CSSC, 상반기 순이익 급증" },
            { id: "5", text: "일간조선해양 제02-4868호 3면 - 해양플랜트 신조 시장 '기지개'" },
            { id: "6", text: "일간조선해양 제02-4868호 3면 - 경남 중소조선, 수주보다 'RG'가 관건" },
            { id: "7", text: "일간조선해양 제02-4868호 3면 - 몸값 오른 STX엔진, 매각 수순" },
            { id: "8", text: "일간조선해양 제02-4868호 4면 - 걸프國, '亞 조선 의존' 탈피 나서" },
            { id: "9", text: "일간조선해양 제02-4868호 4면 - Odisha, 印 조선 클러스터 추진" },
            { id: "10", text: "일간조선해양 제02-4868호 4~5면 - 美, 조선금융 지원제도 개편" }
        ]
    };

    let big3ChartInst = null;
    let offshoreChartInst = null;

    function renderApp() {
        document.getElementById('header-title').innerText = reportData.meta.title;
        document.getElementById('header-subtitle').innerText = reportData.meta.subtitle;

        const pdfBtn = document.getElementById('btn-pdf-drive');
        if (pdfBtn && reportData.meta.pdfDriveUrl) {
            pdfBtn.href = reportData.meta.pdfDriveUrl;
        }

        const grid = document.getElementById('app-grid');
        grid.innerHTML = '';

        const metricCardHtml = `
            <div class="card full-width">
                <div class="card-header">
                    <span class="card-title">주요 한눈에 보기 수치</span>
                    <span class="badge">현황 요약</span>
                </div>
                <div class="metrics-grid">
                    ${reportData.metrics.map(m => `
                        <div class="metric-card">
                            <div class="metric-value">${m.value}</div>
                            <div class="metric-label">${m.label} <a href="#ref-${m.ref}" class="ref">[${m.ref}]</a></div>
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
        grid.insertAdjacentHTML('beforeend', metricCardHtml);

        reportData.sections.forEach(sec => {
            const cardHtml = `
                <div class="card ${sec.fullWidth ? 'full-width' : ''}">
                    <div class="card-header">
                        <span class="card-title">${sec.title}</span>
                        <span class="badge">${sec.badge}</span>
                    </div>
                    <div class="card-content">
                        <ul class="summary-list">
                            ${sec.items.map(item => `<li>${item}</li>`).join('')}
                        </ul>
                        ${sec.chartId ? `<div class="chart-container"><canvas id="${sec.chartId}"></canvas></div>` : ''}
                    </div>
                </div>
            `;
            grid.insertAdjacentHTML('beforeend', cardHtml);
        });

        const refList = document.getElementById('references-list');
        refList.innerHTML = reportData.references.map(r => `
            <li id="ref-${r.id}">${r.text}</li>
        `).join('');

        initCharts();
        bindRefEvents();
    }

    function initCharts() {
        const isDark = document.body.classList.contains('dark-mode');
        const textColor = isDark ? '#e0e0e0' : '#2b2d42';
        const gridColor = isDark ? '#333333' : '#e9ecef';

        const ctxBig3 = document.getElementById('chart-big3');
        if (ctxBig3) {
            if (big3ChartInst) big3ChartInst.destroy();
            big3ChartInst = new Chart(ctxBig3, {
                type: 'bar',
                data: {
                    labels: ['HD한국조선해양', '삼성중공업', '한화오션'],
                    datasets: [{
                        label: '누적 수주액 (억 달러)',
                        data: [180.8, 105.0, 59.4],
                        backgroundColor: ['#0f3d61', '#0077b6', '#00b4d8']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        x: { ticks: { color: textColor }, grid: { color: gridColor } },
                        y: { ticks: { color: textColor }, grid: { color: gridColor }, beginAtZero: true }
                    }
                }
            });
        }

        const ctxOffshore = document.getElementById('chart-offshore');
        if (ctxOffshore) {
            if (offshoreChartInst) offshoreChartInst.destroy();
            offshoreChartInst = new Chart(ctxOffshore, {
                type: 'bar',
                data: {
                    labels: ['중국', '한국', '노르웨이'],
                    datasets: [{
                        label: '해양플랜트 수주액 (억 달러)',
                        data: [154, 12, 5],
                        backgroundColor: ['#00b4d8', '#0f3d61', '#48cae4']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        x: { ticks: { color: textColor }, grid: { color: gridColor } },
                        y: { ticks: { color: textColor }, grid: { color: gridColor }, beginAtZero: true }
                    }
                }
            });
        }
    }

    function bindRefEvents() {
        document.querySelectorAll('.ref').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const targetId = this.getAttribute('href').substring(1);
                const targetElement = document.getElementById(targetId);

                if (targetElement) {
                    targetElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    targetElement.classList.add('highlight');
                    setTimeout(() => {
                        targetElement.classList.remove('highlight');
                    }, 2000);
                }
            });
        });
    }

    document.getElementById('btn-theme').addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
        const isDark = document.body.classList.contains('dark-mode');
        document.getElementById('btn-theme').innerText = isDark ? '라이트모드' : '다크모드';
        initCharts();
    });

    document.getElementById('btn-print').addEventListener('click', () => {
        window.print();
    });

    document.addEventListener('DOMContentLoaded', renderApp);
</script>

</body>
</html>
